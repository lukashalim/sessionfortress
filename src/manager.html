<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Session Fortress</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page">
    <header class="topbar">
      <div class="brand" id="brand"></div>
      <input class="input" id="search" type="search" placeholder="Search name, title, or URL" />
      <div class="row">
        <div id="status" class="pill"><span class="dot"></span><span>Checking</span></div>
        <button class="btn" id="pick-folder" type="button">Backup folder</button>
        <button class="btn btn-ghost" id="open-options" type="button">Settings</button>
      </div>
    </header>
    <main class="main stack">
      <div id="recovery" class="banner bad hidden"></div>
      <div id="folder-banner" class="banner warn hidden"></div>
      <div class="spread">
        <h2>Sessions</h2>
        <div class="row">
          <button class="btn" id="save-window" type="button">Save this window</button>
          <button class="btn" id="save-all" type="button">Save all windows</button>
          <button class="btn" id="import" type="button">Import JSON</button>
          <button class="btn" id="export-all" type="button">Download JSON</button>
          <input id="import-file" class="hidden" type="file" accept="application/json,.json" />
        </div>
      </div>
      <div id="list" class="session-list"></div>
    </main>
    <script type="module" src="./manager.ts"></script>
  </body>
</html>
