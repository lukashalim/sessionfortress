<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Session Fortress</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="popup">
    <div class="wrap stack">
      <div class="spread">
        <div class="brand" id="brand"></div>
        <div id="status" class="pill"><span class="dot"></span><span>Checking</span></div>
      </div>
      <p class="sub">Sessions are saved in this browser. Export JSON for recovery if you reset Chrome or switch computers.</p>
      <div id="banner" class="banner warn hidden"></div>
      <button class="btn btn-primary btn-block" id="save-window" type="button">Save this window</button>
      <div class="row">
        <button class="btn" id="save-all" type="button">Save all windows</button>
        <button class="btn" id="stash" type="button">Stash</button>
      </div>
      <button class="btn btn-ghost btn-block" id="open-manager" type="button">Open manager</button>
      <div class="row secondary-actions">
        <button class="btn btn-ghost btn-sm" id="export-all" type="button">Export</button>
        <button class="btn btn-ghost btn-sm" id="import" type="button">Import</button>
      </div>
      <input id="import-file" class="hidden" type="file" accept="application/json,.json" />
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
